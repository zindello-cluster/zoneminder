# Our image, from our branch (AI-LIVE-DETECTION.md; cluster-docs O374–O377). On each merge to
# ai-live-detection: the files our commits touch are checked against the base image and linted,
# the image is built, started against a throwaway MariaDB with each page we change checked for
# our parts, and pushed to GHCR as ghcr.io/zindello-cluster/zoneminder:<release>-es, its digest in
# the run's summary for the chart. On a pull request into ai-live-detection: the same, without the
# push. Upstream's own workflows are deleted on this branch; only the ai-live-detection-* ones run.
name: build

on:
  push:
    branches: [ai-live-detection]
  pull_request:
    branches: [ai-live-detection]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: The release, and the base image from the Dockerfile
        id: release
        run: |
          set -euo pipefail
          release=$(cat ai-live-detection/UPSTREAM_RELEASE)
          from=$(sed -n 's/^FROM \(ghcr.io\/zoneminder\/zoneminder:[^ ]*\).*/\1/p' ai-live-detection/Dockerfile)
          from_release=$(echo "$from" | sed -n 's/.*:\([0-9][0-9.]*\)-es@.*/\1/p')
          test -n "$from_release" || { echo "::error::ai-live-detection/Dockerfile: expected FROM ghcr.io/zoneminder/zoneminder:<release>-es@sha256:…" >&2; exit 1; }
          test "$from_release" = "$release" || { echo "::error::UPSTREAM_RELEASE is $release but the Dockerfile's FROM is $from_release" >&2; exit 1; }
          echo "base=$from" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "ZoneMinder $release from $from"

      - name: Fetch upstream's tag
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: git fetch -q https://github.com/ZoneMinder/zoneminder.git "refs/tags/$RELEASE:refs/tags/$RELEASE"

      - name: Check our files against the base image, export them, lint them
        env:
          RELEASE: ${{ steps.release.outputs.release }}
          BASE: ${{ steps.release.outputs.base }}
        run: |
          docker pull -q "$BASE"
          sh ai-live-detection/tests/check-files.sh "$RELEASE" HEAD "$BASE" ai-live-detection/web

      - name: Build the image
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          docker build -t "ghcr.io/${{ github.repository }}:$RELEASE-es" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" ai-live-detection

      - name: Start it against a throwaway MariaDB and check each page we change
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: sh ai-live-detection/tests/smoke.sh "ghcr.io/${{ github.repository }}:$RELEASE-es"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:$RELEASE-es"
          docker push -q "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | sed 's/.*@//')
          {
            echo "## $image"
            echo
            echo "Built from \`ai-live-detection\` at ${{ github.sha }}. Digest: \`$digest\`"
            echo
            echo "For the chart (external-security.zindello.com.au, deploy/values.yaml, image:):"
            echo '```yaml'
            echo "repository: ghcr.io/${{ github.repository }}"
            echo "tag: \"$RELEASE-es\""
            echo "digest: $digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
