# Each morning, checks for a new upstream ZoneMinder release. If there's one this branch hasn't
# merged (ai-live-detection/UPSTREAM_RELEASE), it opens an issue saying so, once per release.
# Merging it is a pull request made with ai-live-detection/sync.sh, which the owner approves
# (AI-LIVE-DETECTION.md, cluster-docs O377); nothing here changes the code.
name: upstream

on:
  schedule:
    - cron: '0 21 * * *'   # 07:00 or 08:00 in Sydney
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: New upstream release?
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ZoneMinder/zoneminder
        run: |
          set -eu
          ours=$(cat ai-live-detection/UPSTREAM_RELEASE)
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          echo "ours $ours, upstream's latest $latest"
          [ "$latest" = "$ours" ] && exit 0
          newest=$(printf '%s\n%s\n' "$ours" "$latest" | sort -V | tail -1)
          [ "$newest" = "$latest" ] || { echo "upstream's latest is older than ours"; exit 0; }
          title="Upstream ZoneMinder $latest"
          if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "already raised"; exit 0
          fi
          {
            echo "Upstream released [$latest](https://github.com/$UPSTREAM/releases/tag/$latest); \`ai-live-detection\` is on $ours."
            echo
            echo "1. Read its release notes. Does upstream now have what our commits do (AI-LIVE-DETECTION.md)? Then the fork has done its job: retire it."
            echo "2. Otherwise, sync \`master\`, run \`ai-live-detection/sync.sh $latest\`, push \`upstream-$latest\` and open a pull request into \`ai-live-detection\` with the release notes, risks and rollback."
            echo "3. Once that's merged and built, the chart's pull request in external-security.zindello.com.au moves \`image:\` to the new digest."
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
